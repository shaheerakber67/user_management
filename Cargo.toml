[package]
name = "aws_app"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
name = "aws_app"
path = "src/main.rs"

[dependencies]
actix-web = "4"
env_logger = "0.11"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "uuid", "chrono"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
argon2 = "0.6"
dotenvy = "0.15"
utoipa = { version = "6.0.0", features = ["actix_extras", "uuid", "chrono"] }
utoipa-swagger-ui = { version = "10.0.1", features = ["actix-web"] }
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

[dev-dependencies]
actix-http = "3"
